x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    image: apache/airflow:2.10.3-python3.11
    profiles: ["airflow"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment: &env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://argus:argus@host.docker.internal:5432/argus
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DBT_HOST: ${DBT_HOST:-host.docker.internal}
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas sqlalchemy psycopg2-binary scikit-learn joblib dbt-core==1.8.8 dbt-postgres==1.8.2"
    extra_hosts: *host-gateway
    command: bash -c "airflow db migrate"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./scripts:/opt/airflow/scripts
      - ./dbt:/opt/airflow/dbt
      - ./data:/opt/airflow/data

  airflow-webserver:
    image: apache/airflow:2.10.3-python3.11
    profiles: ["airflow"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *env
    extra_hosts: *host-gateway
    ports:
      - "8080:8080"
    command: webserver
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./scripts:/opt/airflow/scripts
      - ./dbt:/opt/airflow/dbt
      - ./data:/opt/airflow/data

  airflow-scheduler:
    image: apache/airflow:2.10.3-python3.11
    profiles: ["airflow"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *env
    extra_hosts: *host-gateway
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./scripts:/opt/airflow/scripts
      - ./dbt:/opt/airflow/dbt
      - ./data:/opt/airflow/data

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://argus:argus@host.docker.internal:5432/argus
      DBT_HOST: ${DBT_HOST:-host.docker.internal}
    extra_hosts: *host-gateway
    depends_on:
      postgres:
        condition: service_healthy
    command: streamlit run dashboard/app.py --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/workspace
    working_dir: /workspace


volumes:
  pgdata:
