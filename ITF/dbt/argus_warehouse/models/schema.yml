version: 2
sources:
  - name: bronze
    schema: bronze
    tables:
      - name: raw_students
      - name: raw_courses
      - name: raw_enrollments
      - name: raw_grades
      - name: raw_attendance
models:
  - name: stg_students
    columns:
      - name: student_id
        tests: [not_null, unique]
  - name: stg_enrollments
    columns:
      - name: enrollment_id
        tests: [not_null, unique]
      - name: student_id
        tests: [not_null]
      - name: course_code
        tests: [not_null]
  - name: stg_courses
    columns:
      - name: course_code
        tests: [not_null, unique]
  - name: stg_grades
    columns:
      - name: enrollment_id
        tests: [not_null, unique]
      - name: student_id
        tests: [not_null]
      - name: score
        tests: [not_null]
  - name: stg_attendance
    columns:
