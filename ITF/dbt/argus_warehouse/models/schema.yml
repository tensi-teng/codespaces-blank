        tests: [not_null, unique]
  - name: fact_enrollments
    columns:
      - name: enrollment_id
        tests: [not_null, unique]
      - name: student_id
        tests: [not_null]
      - name: course_code
        tests: [not_null]
      - name: semester
        tests: [not_null]
  - name: fact_grades
    columns:
      - name: enrollment_id
        tests: [not_null, unique]
      - name: score
        tests: [not_null]
  - name: fact_attendance
    columns:
      - name: student_id
        tests: [not_null]
      - name: course_code
        tests: [not_null]
      - name: semester
        tests: [not_null]
